<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="ev-title ev-desc">
  <title id="ev-title">La chaîne de vérification et le piège Git LFS</title>
  <desc id="ev-desc">Chaque affirmation du dossier a été confrontée à l'un de quatre mécanismes : l'API REST GitHub, un clone git sans blobs suivi de ls-tree, des sondes HTTP de fichiers bruts, et la récupération directe des portails de jeux de données et de l'API Zenodo. Le point le plus important est le piège Git LFS : les poids du modèle PI-CAI sont des pointeurs de 134 octets qui pointent vers un fichier réel de 127 229 381 octets.</desc>
  <style>
    .bg{fill:#151a21}
    .box{fill:#1a212a;stroke:#2b3440;stroke-width:1}
    .h{fill:#e6edf3;font:700 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .b{fill:#9aa8b6;font:11.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .m{fill:#e6edf3;font:11px ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    .k{fill:#4da3ff;font:700 10.5px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em}
    .a{stroke:#4da3ff;stroke-width:1.5;fill:none;marker-end:url(#a2)}
    .n{fill:#3fb950;font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .r{fill:#f85149;font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .w{fill:#d29922;font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="360"/>
  <text x="30" y="38" fill="#4da3ff" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="700" letter-spacing="0.14em">COMMENT CHAQUE AFFIRMATION A ÉTÉ CONTRÔLÉE</text>

  <g>
    <rect class="box" x="30" y="58" width="196" height="92" rx="9"/>
    <text class="k" x="46" y="80">MÉCANISME 1</text>
    <text class="h" x="46" y="100">API REST GitHub</text>
    <text class="b" x="46" y="120">étoiles · identifiant SPDX</text>
    <text class="b" x="46" y="136">de la licence · branche par défaut</text>
    <text class="b" x="46" y="150">a écarté 3 dépôts « vides » à tort</text>

    <rect class="box" x="242" y="58" width="196" height="92" rx="9"/>
    <text class="k" x="258" y="80">MÉCANISME 2</text>
    <text class="h" x="258" y="100">clone git sans blobs</text>
    <text class="b" x="258" y="120">git ls-tree -r -l HEAD</text>
    <text class="b" x="258" y="136">liste de fichiers faisant autorité</text>
    <text class="b" x="258" y="150">+ tailles exactes des blobs</text>

    <rect class="box" x="454" y="58" width="196" height="92" rx="9"/>
    <text class="k" x="470" y="80">MÉCANISME 3</text>
    <text class="h" x="470" y="100">sondes HTTP brutes</text>
    <text class="b" x="470" y="120">200 + Content-Length</text>
    <text class="b" x="470" y="136">ou 404 — sans ambiguïté</text>
    <text class="b" x="470" y="150">6 fichiers de poids sondés</text>

    <rect class="box" x="666" y="58" width="186" height="92" rx="9"/>
    <text class="k" x="682" y="80">MÉCANISME 4</text>
    <text class="h" x="682" y="100">sources primaires</text>
    <text class="b" x="682" y="120">API Zenodo · TCIA · IDC</text>
    <text class="b" x="682" y="136">Kaggle · grand-challenge</text>
    <text class="b" x="682" y="150">PMC · arXiv · PubMed</text>
  </g>

  <path class="a" d="M128,154 L128,180 L440,180 L440,198"/>
  <path class="a" d="M340,154 L340,180 L440,180"/>
  <path class="a" d="M552,154 L552,180 L440,180"/>
  <path class="a" d="M759,154 L759,180 L440,180"/>

  <rect class="box" x="230" y="202" width="420" height="54" rx="9"/>
  <text class="h" x="440" y="226" text-anchor="middle">Chaque « poids disponibles » et « code présent »</text>
  <text class="b" x="440" y="246" text-anchor="middle">confronté à l'arborescence réelle, non à ce qu'un README affirme</text>

  <!-- Piège LFS -->
  <rect class="box" x="30" y="272" width="822" height="70" rx="9" stroke="#d29922" stroke-opacity="0.5"/>
  <text class="w" x="46" y="294">LE PIÈGE TECHNIQUE N°1 : GIT LFS</text>
  <text class="m" x="46" y="313">weights/unet_F0.pt   →   134 octets (pointeur LFS)   →   fichier réel : 127 229 381 octets</text>
  <text class="b" x="46" y="332">Un clone sans <tspan font-weight="700">git-lfs</tspan> récupère des pointeurs, et l'inférence échoue SILENCIEUSEMENT. Vérifiez la taille réelle avant tout diagnostic.</text>
</svg>
